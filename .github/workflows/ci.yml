name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.11.0", "2026.11.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Install target Home Assistant
        env:
          TARGET_HA: ${{ matrix.homeassistant }}
        run: uv pip install "homeassistant==$TARGET_HA"
      - name: Verify dependencies and Home Assistant version
        env:
          EXPECTED_HA: ${{ matrix.homeassistant }}
        run: |
          uv pip check
          .venv/bin/python -c 'import os; from importlib.metadata import version; assert version("homeassistant") == os.environ["EXPECTED_HA"]'
      - name: Lint
        run: |
          .venv/bin/ruff check custom_components tests scripts
          .venv/bin/ruff format --check custom_components tests scripts
      - name: Test selected Home Assistant version
        run: .venv/bin/python -m pytest
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
